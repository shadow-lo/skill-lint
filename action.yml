name: "skill-lint"
description: "Lint Agent Skills (SKILL.md) and annotate problems on the pull request."
branding:
  icon: "check-square"
  color: "orange"
inputs:
  paths:
    description: "Space-separated SKILL.md files or folders to scan."
    default: "."
  strict:
    description: "Fail on warnings too (true/false)."
    default: "false"
  ignore:
    description: "Comma-separated rule codes to skip, e.g. SL101,SL103."
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - shell: bash
      env:
        SKILL_LINT_PATHS: ${{ inputs.paths }}
        SKILL_LINT_STRICT: ${{ inputs.strict }}
        SKILL_LINT_IGNORE: ${{ inputs.ignore }}
      run: |
        args=(--format github)
        [ "$SKILL_LINT_STRICT" = "true" ] && args+=(--strict)
        [ -n "$SKILL_LINT_IGNORE" ] && args+=(--ignore "$SKILL_LINT_IGNORE")
        # shellcheck disable=SC2086
        skill-lint "${args[@]}" $SKILL_LINT_PATHS
