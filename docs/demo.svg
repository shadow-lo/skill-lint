      <stop offset="0" stop-color="#151a23"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="349" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="430" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e">~/my-skills</text>
  <line x1="0" y1="44" x2="860" y2="44" stroke="#30363d"/>
  <g xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#c9d1d9">
    <text x="24" y="74"><tspan fill="#7ee787">$</tspan> skill-lint examples</text>
    <text x="24" y="102"><tspan fill="#ff7b72">✗</tspan> examples/Bad_Skill/SKILL.md</text>
    <text x="24" y="124"><tspan fill="#6e7681">     2  </tspan><tspan fill="#ff7b72">SL003</tspan>  'name' must be kebab-case: 'My_Helper'</text>
    <text x="24" y="144"><tspan fill="#6e7681">     2  </tspan><tspan fill="#e3b341">SL101</tspan>  'name' is 'My_Helper' but the folder is 'Bad_Skill'</text>
    <text x="24" y="164"><tspan fill="#6e7681">     3  </tspan><tspan fill="#ff7b72">SL006</tspan>  'description' must not contain angle brackets</text>
